name: CD

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: northgate-cloud-run-production
  cancel-in-progress: false

jobs:
  ci:
    name: Run CI gates
    uses: ./.github/workflows/ci.yml

  deploy:
    name: Deploy to Cloud Run
    needs: ci
    if: vars.GCP_DEPLOY_ENABLED == 'true' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write
    env:
      PROJECT_ID: ${{ vars.GCP_PROJECT_ID }}
      REGION: ${{ vars.GCP_REGION }}
      REPOSITORY: ${{ vars.GCP_ARTIFACT_REPOSITORY }}
    steps:
      - name: Check out source
        uses: actions/checkout@v4

      - name: Validate deployment configuration
        env:
          DEPLOYER_SERVICE_ACCOUNT: ${{ vars.GCP_DEPLOYER_SERVICE_ACCOUNT }}
          WORKLOAD_IDENTITY_PROVIDER: ${{ vars.GCP_WORKLOAD_IDENTITY_PROVIDER }}
        run: |
          test -n "$PROJECT_ID"
          test -n "$DEPLOYER_SERVICE_ACCOUNT"
          test -n "$WORKLOAD_IDENTITY_PROVIDER"
          test "$REGION" = "asia-south1"
          test "$REPOSITORY" = "northgate-containers"

      - name: Authenticate to Google Cloud
        uses: google-github-actions/auth@v2
        with:
          workload_identity_provider: ${{ vars.GCP_WORKLOAD_IDENTITY_PROVIDER }}
          service_account: ${{ vars.GCP_DEPLOYER_SERVICE_ACCOUNT }}

      - name: Set up Google Cloud CLI
        uses: google-github-actions/setup-gcloud@v2
        with:
          project_id: ${{ vars.GCP_PROJECT_ID }}

      - name: Configure Docker for Artifact Registry
        run: gcloud auth configure-docker "${REGION}-docker.pkg.dev" --quiet

      - name: Build and publish immutable image
        env:
          IMAGE: ${{ vars.GCP_REGION }}-docker.pkg.dev/${{ vars.GCP_PROJECT_ID }}/${{ vars.GCP_ARTIFACT_REPOSITORY }}/northgate-chase:${{ github.sha }}
        run: |
          docker build --tag "$IMAGE" .
          docker push "$IMAGE"
          echo "image=$IMAGE" >> "$GITHUB_OUTPUT"
        id: image

      - name: Deploy to Cloud Run
        env:
          IMAGE: ${{ steps.image.outputs.image }}
          RUNTIME_SERVICE_ACCOUNT: ${{ vars.GCP_RUNTIME_SERVICE_ACCOUNT }}
        run: |
          test -n "$RUNTIME_SERVICE_ACCOUNT"
          gcloud run deploy northgate-chase \
            --image "$IMAGE" \
            --project "$PROJECT_ID" \
            --region "$REGION" \
            --platform managed \
            --allow-unauthenticated \
            --service-account "$RUNTIME_SERVICE_ACCOUNT" \
            --port 8080 \
            --cpu 1 \
            --memory 1Gi \
            --min 0 \
            --max 1 \
            --concurrency 20 \
            --set-env-vars "DATABASE_PATH=/tmp/northgate.sqlite,HOST=0.0.0.0,ASSISTANT_PORT=4175,GCP_PROJECT_ID=$PROJECT_ID,VERTEX_AI_ENABLED=true,VERTEX_AI_LOCATION=global,GEMINI_MODEL=gemini-3-flash-preview,NORTHGATE_DEMO_AUTH_ENABLED=true,NORTHGATE_COOKIE_SECURE=true,NORTHGATE_SESSION_TTL_SECONDS=28800" \
            --set-secrets "NORTHGATE_SESSION_SECRET=northgate-session-secret:latest" \
            --quiet

          SERVICE_URL="$(gcloud run services describe northgate-chase \
            --project "$PROJECT_ID" \
            --region "$REGION" \
            --format='value(status.url)')"
          test -n "$SERVICE_URL"
          echo "service_url=$SERVICE_URL" >> "$GITHUB_OUTPUT"
        id: deploy

      - name: Deployment summary
        env:
          SERVICE_URL: ${{ steps.deploy.outputs.service_url }}
        run: |
          echo "### Northgate Chase deployed to Cloud Run" >> "$GITHUB_STEP_SUMMARY"
          echo "" >> "$GITHUB_STEP_SUMMARY"
          echo "- Region: \`$REGION\`" >> "$GITHUB_STEP_SUMMARY"
          echo "- Service: [$SERVICE_URL]($SERVICE_URL)" >> "$GITHUB_STEP_SUMMARY"
          echo "- Health: [$SERVICE_URL/api/health]($SERVICE_URL/api/health)" >> "$GITHUB_STEP_SUMMARY"
